<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
  />
  <meta
    name="description"
    content="BazaarFlow; ürün, stok, satış, FIFO maliyet ve kârlılık takibi için local-first bir uygulamadır."
  />
  <meta name="application-name" content="BazaarFlow" />
  <meta name="theme-color" content="#f7f9f8" />
  <meta name="color-scheme" content="light dark" />
  <script>
    (() => {
      const storageKey = 'bazaarflow.theme'
      const colorStorageKey = 'bazaarflow.colorTheme'
      const validColors = new Set([
        'bazaarflow',
        'ocean',
        'indigo',
        'violet',
        'rose',
        'sunset',
        'graphite',
      ])

      let preference = 'system'
      let colorTheme = 'bazaarflow'

      try {
        const storedValue = localStorage.getItem(storageKey)
        if (storedValue === 'light' || storedValue === 'dark' || storedValue === 'system') {
          preference = storedValue
        }

        const storedColor = localStorage.getItem(colorStorageKey)
        if (validColors.has(storedColor)) {
          colorTheme = storedColor
        }
      } catch {
        preference = 'system'
        colorTheme = 'bazaarflow'
      }

      const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false
      const resolvedTheme = preference === 'system'
        ? (systemDark ? 'dark' : 'light')
        : preference

      document.documentElement.dataset.theme = resolvedTheme
      document.documentElement.dataset.themePreference = preference
      document.documentElement.dataset.colorTheme = colorTheme
      document.documentElement.style.colorScheme = resolvedTheme
      document.querySelector('meta[name="theme-color"]')?.setAttribute(
        'content',
        resolvedTheme === 'dark' ? '#0b1110' : '#f7f9f8',
      )
    })()
  </script>

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <title>BazaarFlow — Satış &amp; Stok Takibi</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
